# The shared lab (Project 0). Everything every project needs, on one laptop.
#   make up                     start it
#   make smoke                  30-second k6 test against /hello, visible in Grafana
# Projects add their own services with projects/NN-*/docker-compose.override.yml (make up p=NN).
name: scaling-lab

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      POSTGRES_DB: ${POSTGRES_DB:-lab}
    ports: ["${PG_PORT:-5433}:5432"]
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./shared/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Cache, rate limits, locks, pub/sub and the job queues (BullMQ).
  # AOF with fsync every second: queued jobs survive a Redis restart, losing at most ~1 s.
  # noeviction is required by BullMQ: a full Redis must reject writes, never drop job keys.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # MinIO stopped publishing images in 2025; Chainguard builds it from source.
  # Their free tier only publishes :latest, so this one cannot be pinned.
  minio:
    image: chainguard/minio:latest
    user: "0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lab}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lab-secret}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_UI_PORT:-9001}:9001"
    volumes: [miniodata:/data]
    restart: unless-stopped

  # Creates the buckets, then exits. No shell in this image, so it retries by restarting
  # until MinIO answers.
  minio-init:
    image: chainguard/minio-client:latest
    depends_on: [minio]
    command: ["mb", "--ignore-existing", "lab/uploads", "lab/exports", "lab/imports", "lab/documents"]
    environment:
      MC_HOST_lab: http://${MINIO_ROOT_USER:-lab}:${MINIO_ROOT_PASSWORD:-lab-secret}@minio:9000
    restart: on-failure

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "${TOXIPROXY_PORT:-8474}:8474" # control API
      - "18080:18080" # partner
      - "19000:19000" # minio
      - "15432:15432" # postgres
      - "16379:16379" # redis
    volumes: [./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro]
    restart: unless-stopped

  # A stand-in for third-party APIs (Shopify, a CRM, an LLM provider). Written in Node because it
  # is a black box your Python apps call, not part of what you build or talk about.
  fake-partner:
    build: { context: ., dockerfile: shared/fake-partner/Dockerfile }
    image: scaling-lab/fake-partner
    environment:
      SERVICE_NAME: fake-partner
      PORT: "8080"
      LOG_LEVEL: info
      PARTNER_WEBHOOK_SECRET: ${PARTNER_WEBHOOK_SECRET:-whsec_lab}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    ports: ["${FAKE_PARTNER_PORT:-8080}:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"] # so webhooks can reach apps running on the host
    labels:
      lab.metrics.port: "8080"

  # FastAPI hello-world, built on shared/py-common like every project app.
  hello:
    build: { context: ., dockerfile: shared/hello/Dockerfile }
    image: scaling-lab/hello
    environment:
      SERVICE_NAME: hello
      LOG_LEVEL: info
    ports: ["${HELLO_PORT:-3100}:8000"]
    labels:
      lab.metrics.port: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Starts last, so when hello is up the whole lab is ready (and `up --wait` succeeds,
    # since compose expects minio-init to exit).
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  # Load balancer for a project's `app` service: docker compose --profile lb up -d --scale app=5
  nginx:
    image: nginx:alpine
    profiles: [lb]
    ports: ["${NGINX_PORT:-8000}:80"]
    volumes: [./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    restart: unless-stopped

  # --- observability ---

  prometheus:
    image: prom/prometheus:v3.15.1
    user: root # reads the Docker socket to discover app containers
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver # k6 pushes its results here
      - --web.enable-lifecycle
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/scaling-lab.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    privileged: true
    devices: [/dev/kmsg]
    command: ["--docker_only=true", "--housekeeping_interval=5s", "--store_container_labels=false", "--disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl"]
    ports: ["${CADVISOR_PORT:-8081}:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:-lab}@postgres:5432/${POSTGRES_DB:-lab}?sslmode=disable
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.96.0
    environment:
      REDIS_ADDR: redis://redis:6379
      # Celery queue depth: the default `celery` queue, every queue named q.<name>, and the
      # `unacked` hash (tasks a worker took but has not acknowledged, with acks_late).
      REDIS_EXPORTER_CHECK_KEYS: celery,q.*,unacked
    depends_on: [redis]
    restart: unless-stopped

  # --- tools (run on demand, never started by `up`) ---

  k6:
    image: grafana/k6:2.3.0
    profiles: [tools]
    working_dir: /lab
    volumes: [./:/lab:ro]
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s

volumes:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
