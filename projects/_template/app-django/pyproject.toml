[project]
name = "p__P__-__NAME__"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
    "labcommon[django]",
]

[tool.uv]
package = false

[tool.uv.sources]
labcommon = { path = "../../../shared/py-common", editable = true }

[dependency-groups]
dev = ["pytest>=9", "pytest-django>=4.11", "mypy>=2.4", "django-stubs>=5.2"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
mypy_path = "."
check_untyped_defs = true
warn_unused_ignores = true
exclude = ['(^|/)\.venv/']

[tool.django-stubs]
django_settings_module = "config.settings"
