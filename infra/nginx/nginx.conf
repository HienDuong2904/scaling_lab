# Load balancer for N instances of a project's `app` service (Project 1 fix 5, Project 6, 7).
# Started with the `lb` profile:  docker compose --profile lb up -d --scale app=5
#
# Docker's DNS returns every `app` replica; the `resolve` flag re-resolves every 5 s,
# so scaling up or down needs no nginx restart.
worker_processes auto;
events { worker_connections 4096; }

http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  access_log off;

  # Keep the caller's x-request-id; make one only when there is none.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  upstream app {
    zone app 64k;
    server app:8000 resolve max_fails=3 fail_timeout=5s;
    keepalive 64;
  }

  server {
    listen 80;

    location = /nginx-health { return 200 "ok\n"; }

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $req_id;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      add_header X-Upstream $upstream_addr always;
    }

    # WebSockets (Project 7)
    location /ws {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 1h;
    }
  }
}
