# Lab Postgres 16. Tuned for a laptop running 50M-row tables, not for production.
listen_addresses = '*'
max_connections = 100                  # deliberately low: Project 1 and 3 exhaust it

shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 16MB
maintenance_work_mem = 512MB           # faster CREATE INDEX on big tables
max_wal_size = 4GB                     # fewer checkpoints during seeding
min_wal_size = 1GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1                 # SSD

# Query statistics: SELECT * FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 10;
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
track_io_timing = on                   # I/O timings in EXPLAIN (ANALYZE, BUFFERS)
compute_query_id = on

# Logging what matters for the break tests
log_min_duration_statement = 500ms
log_lock_waits = on                    # Project 3: migrations queued behind long transactions
deadlock_timeout = 1s
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

# Ready for a streaming replica (Project 3)
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
hot_standby = on
